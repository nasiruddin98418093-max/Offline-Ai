name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/offlineai

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OfflineAI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.offlineai"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.offlineai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("com.google.mediapipe:tasks-genai:0.10.22")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Offline AI"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <uses-native-library android:name="libOpenCL-car.so" android:required="false"/>
                  <uses-native-library android:name="libOpenCL-pixel.so" android:required="false"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/offlineai/MainActivity.kt <<'EOF'
          package com.example.offlineai

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import com.google.mediapipe.tasks.genai.llminference.LlmInference
          import java.io.File
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var chatBox: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private lateinit var sendBtn: Button
              private lateinit var status: TextView
              private var llm: LlmInference? = null
              private val history = mutableListOf<Pair<String, String>>()
              private var busy = false
              private val pickCode = 1

              private val sysText = "You are a helpful assistant and an expert programmer. " +
                  "Reply in the same language the user writes in (Bengali or English). " +
                  "When asked for a program, write complete, working code in a code block and explain briefly."

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#F5F6F8"))

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.setPadding(dp(10), dp(30), dp(10), dp(4))
                  val pickBtn = Button(this)
                  pickBtn.text = "Choose model"
                  pickBtn.setOnClickListener { pickModel() }
                  val newBtn = Button(this)
                  newBtn.text = "New chat"
                  newBtn.setOnClickListener {
                      history.clear()
                      chatBox.removeAllViews()
                  }
                  top.addView(pickBtn)
                  top.addView(newBtn)
                  root.addView(top)

                  status = TextView(this)
                  status.setPadding(dp(14), dp(2), dp(14), dp(6))
                  status.textSize = 13f
                  root.addView(status)

                  scroll = ScrollView(this)
                  chatBox = LinearLayout(this)
                  chatBox.orientation = LinearLayout.VERTICAL
                  chatBox.setPadding(dp(6), dp(6), dp(6), dp(6))
                  scroll.addView(chatBox)
                  root.addView(scroll, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

                  val bottom = LinearLayout(this)
                  bottom.orientation = LinearLayout.HORIZONTAL
                  bottom.setPadding(dp(8), dp(6), dp(8), dp(10))
                  input = EditText(this)
                  input.hint = "Ask anything / যা খুশি লিখুন"
                  input.maxLines = 5
                  sendBtn = Button(this)
                  sendBtn.text = "Send"
                  sendBtn.setOnClickListener { send() }
                  bottom.addView(input, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  bottom.addView(sendBtn)
                  root.addView(bottom)

                  setContentView(root)

                  val saved = File(filesDir, "model.task")
                  if (saved.exists()) {
                      thread { loadModel(saved) }
                  } else {
                      status.text = "Tap 'Choose model' and select a .task model file"
                  }
              }

              private fun addBubble(msg: String, user: Boolean): TextView {
                  val tv = TextView(this)
                  tv.text = msg
                  tv.textSize = 15f
                  tv.setTextIsSelectable(true)
                  tv.setPadding(dp(12), dp(8), dp(12), dp(8))
                  tv.setTextColor(Color.parseColor("#16202C"))
                  tv.setBackgroundColor(Color.parseColor(if (user) "#DCE5FF" else "#FFFFFF"))
                  val lp = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  lp.setMargins(dp(4), dp(4), dp(4), dp(4))
                  lp.gravity = if (user) Gravity.END else Gravity.START
                  chatBox.addView(tv, lp)
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
                  return tv
              }

              private fun pickModel() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  startActivityForResult(i, pickCode)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == pickCode && resultCode == RESULT_OK) {
                      data?.data?.let { importModel(it) }
                  }
              }

              private fun importModel(uri: Uri) {
                  status.text = "Copying model... this takes a few minutes"
                  llm?.close()
                  llm = null
                  thread {
                      try {
                          val dest = File(filesDir, "model.task")
                          contentResolver.openInputStream(uri)!!.use { ins ->
                              dest.outputStream().use { outs ->
                                  val buf = ByteArray(1024 * 1024)
                                  var total = 0L
                                  var lastShown = 0L
                                  while (true) {
                                      val n = ins.read(buf)
                                      if (n < 0) break
                                      outs.write(buf, 0, n)
                                      total += n
                                      if (total - lastShown > 50L * 1024 * 1024) {
                                          lastShown = total
                                          val mb = total / 1048576
                                          runOnUiThread { status.text = "Copying: " + mb + " MB" }
                                      }
                                  }
                              }
                          }
                          loadModel(dest)
                      } catch (e: Exception) {
                          runOnUiThread { status.text = "Error: " + e.message }
                      }
                  }
              }

              private fun loadModel(f: File) {
                  runOnUiThread { status.text = "Loading model..." }
                  try {
                      val opts = LlmInference.LlmInferenceOptions.builder()
                          .setModelPath(f.absolutePath)
                          .setMaxTokens(2048)
                          .build()
                      llm = LlmInference.createFromOptions(this, opts)
                      runOnUiThread { status.text = "Ready (offline)" }
                  } catch (e: Exception) {
                      runOnUiThread { status.text = "Load failed: " + e.message }
                  }
              }

              private fun buildPrompt(q: String): String {
                  val turns = ArrayDeque<Pair<String, String?>>()
                  var used = q.length
                  for (h in history.asReversed()) {
                      used += h.first.length + h.second.length
                      if (used > 1500) break
                      turns.addFirst(Pair(h.first, h.second))
                  }
                  turns.addLast(Pair(q, null))
                  val sb = StringBuilder()
                  turns.forEachIndexed { i, t ->
                      val u = if (i == 0) sysText + "\n\n" + t.first else t.first
                      sb.append("<start_of_turn>user\n").append(u)
                          .append("<end_of_turn>\n<start_of_turn>model\n")
                      if (t.second != null) sb.append(t.second).append("<end_of_turn>\n")
                  }
                  return sb.toString()
              }

              private fun send() {
                  val q = input.text.toString().trim()
                  if (q.isEmpty() || busy) return
                  val model = llm
                  if (model == null) {
                      Toast.makeText(this, "Choose a model first", Toast.LENGTH_SHORT).show()
                      return
                  }
                  input.setText("")
                  addBubble(q, true)
                  val aiView = addBubble("...", false)
                  busy = true
                  sendBtn.isEnabled = false
                  val prompt = buildPrompt(q)
                  val sb = StringBuilder()
                  try {
                      model.generateResponseAsync(prompt) { part, done ->
                          val text = synchronized(sb) { sb.append(part).toString() }
                          runOnUiThread {
                              aiView.text = text
                              scroll.fullScroll(View.FOCUS_DOWN)
                              if (done) {
                                  history.add(Pair(q, text))
                                  busy = false
                                  sendBtn.isEnabled = true
                              }
                          }
                      }
                  } catch (e: Exception) {
                      aiView.text = "Error: " + e.message
                      busy = false
                      sendBtn.isEnabled = true
                  }
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
